<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="720" height="220" role="img" aria-labelledby="t d"><title id="t">침수차 확인 순서</title><desc id="d">계약 전 이력 조회, 실내 확인, 숨은 곳 확인, 계약서 특약 기재 순서의 흐름도</desc>
