<g fill="#d8dce6" font-size="13"><text x="95" y="140" font-size="12">카히스토리·자동차365</text><text x="270" y="140">곰팡이·악취, 안전벨트</text><text x="445" y="140">시트 바닥·엔진룸·힌지</text><text x="622" y="140">침수 시 전액 환급 기재</text></g>
