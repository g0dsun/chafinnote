<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="t d"><title id="t">침수 흔적 확인 부위</title><desc id="d">행정안전부가 안내한 침수차 확인 부위 8곳을 목록으로 정리한 표</desc>
